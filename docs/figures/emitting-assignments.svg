<rect x="190" y="60" width="430" height="327.23" fill="var(--panel)" stroke="var(--line)" stroke-width="1" rx="3"/><text x="405" y="48" font-size="12" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">starc</text><text x="200" y="72" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">void compile_assignment(char* variable) {</text><text x="200" y="88.28" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  if (variable != (char*) 0) {</text><text x="200" y="104.55" font-size="10.5" fill="var(--muted)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    // variable is identifier</text><text x="200" y="120.83" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    dereference = 0;</text><text x="200" y="137.1" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    entry = get_variable_entry(variable);</text><text x="200" y="153.38" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    base = get_scope(entry);</text><text x="200" y="169.65" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    offset = load_upper_address(entry);</text><text x="200" y="185.93" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    ltype = get_type(entry);</text><text x="200" y="202.2" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  } else { ... } // "*" identifier or "*" "(" expression ")"</text><text x="200" y="218.48" font-size="10.5" fill="var(--muted)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  // assert: base + offset is address where to store</text><text x="200" y="234.75" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  if (symbol == SYM_ASSIGN) {</text><text x="200" y="251.03" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    get_symbol();</text><text x="200" y="267.3" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    rtype = compile_expression();</text><text x="200" y="283.58" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    if (ltype != rtype) type_warning(ltype, rtype);</text><text x="200" y="299.85" font-size="10.5" fill="var(--muted)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    // assign value of RHS in current temporary to LHS</text><text x="200" y="316.12" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    emit_store(base, offset, current_temporary());</text><text x="200" y="332.4" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    tfree(1);</text><text x="200" y="348.68" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  } else syntax_error_expected_symbol(SYM_ASSIGN);</text><text x="200" y="364.95" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">}</text>
