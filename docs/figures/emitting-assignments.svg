<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 -3.0 985.0 632.0" width="985" height="632" role="img" aria-label="Emitting an assignment: evaluate the right-hand side, then store it where the left-hand side lives">
<title>Emitting an assignment: evaluate the right-hand side, then store it where the left-hand side lives</title>
