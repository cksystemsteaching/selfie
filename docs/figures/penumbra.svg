<svg xmlns="http://www.w3.org/2000/svg" viewBox="65.2 96.7 700.8 303.9" width="701" height="304" role="img" aria-label="No text contains its own application: the core, the penumbra, and the cases in between">
<title>No text contains its own application: the core, the penumbra, and the cases in between</title>
<style>svg{--ink:#131C2A;--ink-2:#39485C;--muted:#5D6E85;--line:rgba(19,28,42,.18);--syn:#A2661A;--sem:#1F6C86;--bad:#A63E5A;--panel:#FFFFFF;--ground:#EFF1F3}@media (prefers-color-scheme: dark){svg{--ink:#E7EDF6;--ink-2:#B6C4D8;--muted:#8093AF;--line:rgba(122,162,204,.16);--syn:#E0A550;--sem:#5BB0C7;--bad:#C8607A;--panel:#111C2E;--ground:#080E18}}text{font-family:"JetBrains Mono","SFMono-Regular","SF Mono","Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif}</style>
<g class="f" data-step="2"><rect x="272" y="143.28" width="272" height="181.44" fill="var(--bad)" fill-opacity="0.16"/><rect x="272" y="143.28" width="272" height="181.44" fill="none" stroke="var(--bad)" stroke-width="1" opacity="0.5" stroke-dasharray="3 4"/><text x="408" y="121.68" font-size="19.01" fill="var(--bad)" text-anchor="middle" dominant-baseline="central">penumbra · the text does not decide</text></g>
<line x1="80" y1="234" x2="752" y2="234" stroke="var(--line)" stroke-width="1"/>
<text x="80" y="329.04" font-size="17.28" fill="var(--muted)" text-anchor="start" dominant-baseline="central">plainly a vehicle</text>
<text x="752" y="329.04" font-size="17.28" fill="var(--muted)" text-anchor="end" dominant-baseline="central">plainly not</text>
<line x1="106.88" y1="234" x2="106.88" y2="199.44" stroke="var(--ink-2)" stroke-width="1" stroke-dasharray="2 3" opacity="0.55"/>
