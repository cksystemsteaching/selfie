<text x="106.88" y="184.32" font-size="18.36" fill="var(--ink-2)" text-anchor="middle" dominant-baseline="central">a car</text>
<g class="f" data-step="1"><line x1="281.6" y1="234" x2="281.6" y2="268.56" stroke="var(--syn)" stroke-width="1" stroke-dasharray="2 3" opacity="0.55"/><circle cx="281.6" cy="234" r="4.32" fill="var(--syn)"/><text x="281.6" y="283.68" font-size="18.36" fill="var(--syn)" text-anchor="middle" dominant-baseline="central">an ambulance</text><line x1="416" y1="234" x2="416" y2="199.44" stroke="var(--syn)" stroke-width="1" stroke-dasharray="2 3" opacity="0.55"/><circle cx="416" cy="234" r="4.32" fill="var(--syn)"/><text x="416" y="184.32" font-size="18.36" fill="var(--syn)" text-anchor="middle" dominant-baseline="central">a bicycle</text><line x1="536.96" y1="234" x2="536.96" y2="268.56" stroke="var(--syn)" stroke-width="1" stroke-dasharray="2 3" opacity="0.55"/><circle cx="536.96" cy="234" r="4.32" fill="var(--syn)"/><text x="536.96" y="283.68" font-size="18.36" fill="var(--syn)" text-anchor="middle" dominant-baseline="central">a skateboard</text><line x1="657.92" y1="234" x2="657.92" y2="199.44" stroke="var(--bad)" stroke-width="1" stroke-dasharray="2 3" opacity="0.55"/><circle cx="657.92" cy="234" r="4.32" fill="var(--bad)"/><text x="657.92" y="184.32" font-size="18.36" fill="var(--bad)" text-anchor="middle" dominant-baseline="central">a memorial jeep</text></g>
