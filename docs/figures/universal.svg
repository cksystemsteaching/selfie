<rect x="32" y="206.73" width="168" height="45.54" fill="var(--muted)" stroke="var(--muted)" stroke-width="1" rx="12.75" fill-opacity="0.06"/>
<text x="116" y="229.5" font-size="19.66" fill="var(--ink-2)" text-anchor="middle" dominant-baseline="central">SORT</text>
<rect x="32" y="301.23" width="168" height="45.54" fill="var(--muted)" stroke="var(--muted)" stroke-width="1" rx="12.75" fill-opacity="0.06"/>
<text x="116" y="324" font-size="19.66" fill="var(--ink-2)" text-anchor="middle" dominant-baseline="central">PRINT</text>
<line x1="248" y1="45" x2="248" y2="378.72" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="532" y="54" font-size="16.97" fill="var(--sem)" text-anchor="middle" dominant-baseline="central">one machine, every job</text>
<g class="f" data-step="1"><rect x="296" y="112.23" width="198.24" height="45.54" fill="var(--syn)" stroke="var(--syn)" stroke-width="1" rx="12.75" fill-opacity="0.12"/><text x="395.12" y="135" font-size="18.63" fill="var(--syn)" text-anchor="middle" dominant-baseline="central">&lt;ADD&gt;</text><rect x="494.24" y="112.23" width="273.76" height="45.54" fill="var(--muted)" stroke="var(--muted)" stroke-width="1" rx="12.75" fill-opacity="0.04"/><text x="631.12" y="135" font-size="16.97" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">input</text><text x="395.12" y="96.29" font-size="16.15" fill="var(--syn)" text-anchor="middle" dominant-baseline="central">a machine, written down</text><line x1="532" y1="162.32" x2="532" y2="217.85" stroke="var(--line)" stroke-width="1.4"/><path d="M532 217.85 L527.97 208.31 L536.03 208.31 Z" fill="var(--line)"/><rect x="409.28" y="220.95" width="245.44" height="62.1" fill="var(--sem)" stroke="var(--sem)" stroke-width="1" rx="17.39" fill-opacity="0.1"/><text x="532" y="241.65" font-size="31.05" fill="var(--sem)" text-anchor="middle" dominant-baseline="central">U</text><text x="532" y="268.15" font-size="16.15" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">reads it · becomes it</text><line x1="532" y1="287.19" x2="532" y2="336.19" stroke="var(--line)" stroke-width="1.4"/><path d="M532 336.19 L527.97 326.66 L536.03 326.66 Z" fill="var(--line)"/><text x="532" y="360" font-size="19.66" fill="var(--sem)" text-anchor="middle" dominant-baseline="central">a sum</text></g>
