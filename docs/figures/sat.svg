<svg xmlns="http://www.w3.org/2000/svg" viewBox="16.0 5.0 886.0 497.5" width="886" height="498" role="img" aria-label="CDCL on Rivest's formula: decide, propagate, conflict, learn, backjump">
<title>CDCL on Rivest's formula: decide, propagate, conflict, learn, backjump</title>
<style>svg{--ink:#131C2A;--ink-2:#39485C;--muted:#5D6E85;--line:rgba(19,28,42,.18);--syn:#A2661A;--sem:#1F6C86;--bad:#A63E5A;--panel:#FFFFFF;--ground:#EFF1F3}@media (prefers-color-scheme: dark){svg{--ink:#E7EDF6;--ink-2:#B6C4D8;--muted:#8093AF;--line:rgba(122,162,204,.16);--syn:#E0A550;--sem:#5BB0C7;--bad:#C8607A;--panel:#111C2E;--ground:#080E18}}text{font-family:"JetBrains Mono","SFMono-Regular","SF Mono","Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif}</style>
<text x="30" y="30" font-size="16.1" fill="var(--ink)" text-anchor="start" dominant-baseline="central" class="serif">CDCL on Rivest's seven clauses</text>
<text x="30" y="62" font-size="13.22" fill="var(--muted)" text-anchor="start" dominant-baseline="central">C1 (2 ∨ 3 ∨ ¬4)</text>
<text x="30" y="82" font-size="13.22" fill="var(--muted)" text-anchor="start" dominant-baseline="central">C2 (1 ∨ 3 ∨ 4)</text>
<text x="30" y="102" font-size="13.22" fill="var(--muted)" text-anchor="start" dominant-baseline="central">C3 (¬1 ∨ 2 ∨ 4)</text>
<text x="30" y="122" font-size="13.22" fill="var(--muted)" text-anchor="start" dominant-baseline="central">C4 (¬1 ∨ ¬2 ∨ 3)</text>
<text x="30" y="142" font-size="13.22" fill="var(--muted)" text-anchor="start" dominant-baseline="central">C5 (¬2 ∨ ¬3 ∨ 4)</text>
<text x="30" y="162" font-size="13.22" fill="var(--muted)" text-anchor="start" dominant-baseline="central">C6 (¬1 ∨ ¬3 ∨ ¬4)</text>
<text x="30" y="182" font-size="13.22" fill="var(--muted)" text-anchor="start" dominant-baseline="central">C7 (1 ∨ ¬2 ∨ ¬4)</text>
<g class="f" data-step="1"></g>
<g class="f" data-step="2"></g>
<g class="f" data-step="3"></g>
<g class="f" data-step="4"></g>
<text x="450" y="480" font-size="12.65" fill="var(--muted)" text-anchor="middle" dominant-baseline="central" class="serif">four assignments examined, three clauses learned — instead of sixteen assignments enumerated</text>
