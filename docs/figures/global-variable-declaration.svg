<text x="30" y="530" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">cstar      = { variable [ initialize ] ";" | procedure } .</text>
<text x="30" y="547" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">variable   = type identifier .</text>
<text x="30" y="564" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">type       = "uint64_t" [ "*" ] .</text>
<text x="30" y="581" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">initialize = "=" [ cast ] [ "-" ] value .</text>
