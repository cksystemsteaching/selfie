<rect x="190" y="60" width="430" height="376.05" fill="var(--panel)" stroke="var(--line)" stroke-width="1" rx="3"/><text x="405" y="48" font-size="12" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">starc</text><text x="200" y="72" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">void compile_cstar() {</text><text x="200" y="88.28" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  ... if (is_type()) {</text><text x="200" y="104.55" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    type = compile_type();</text><text x="200" y="120.83" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    if (symbol == SYM_IDENTIFIER) {</text><text x="200" y="137.1" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      variable_or_procedure = identifier; get_symbol();</text><text x="200" y="153.38" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      if (symbol != SYM_LPARENTHESIS) {</text><text x="200" y="169.65" font-size="10.5" fill="var(--muted)" text-anchor="start" dominant-baseline="central" xml:space="preserve">        // global variable declaration or definition</text><text x="200" y="185.93" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">        entry = compile_variable(variable_or_procedure, type, 0);</text><text x="200" y="202.2" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">        set_value(entry, compile_initialize(type));</text><text x="200" y="218.48" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">        emit_data_word(get_value(entry), get_address(entry), ...);</text><text x="200" y="234.75" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">        get_expected_symbol(SYM_SEMICOLON);</text><text x="200" y="251.03" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      } else compile_procedure(...);</text><text x="200" y="267.3" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">}</text><text x="200" y="283.58" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">uint64_t* compile_variable(char* variable, uint64_t type, ...) {</text><text x="200" y="299.85" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  entry = search_global_symbol_table(variable, VARIABLE);</text><text x="200" y="316.12" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  if (entry == 0) {</text><text x="200" y="332.4" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    data_size = data_size + WORDSIZE;</text><text x="200" y="348.68" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    entry = create_symbol_table_entry(GLOBAL_TABLE, variable,</text><text x="200" y="364.95" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      line_number, VARIABLE, type, 0, -data_size);</text><text x="200" y="381.23" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  } else warning: redefinition ignored</text><text x="200" y="397.5" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  return entry;</text><text x="200" y="413.78" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">}</text>
