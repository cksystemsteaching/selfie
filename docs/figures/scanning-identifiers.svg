<rect x="230" y="60" width="440" height="214.07" fill="var(--panel)" stroke="var(--line)" stroke-width="1" rx="3"/><text x="450" y="48" font-size="12" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">starc</text><text x="240" y="72" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">if (is_letter(character)) {</text><text x="240" y="89.83" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  identifier = string_alloc(MAX_IDENTIFIER_LENGTH);</text><text x="240" y="107.65" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  i = 0;</text><text x="240" y="125.47" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  while (is_character_letter_or_digit_or_underscore()) {</text><text x="240" y="143.3" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    store_character(identifier, i, character);</text><text x="240" y="161.12" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    i = i + 1;</text><text x="240" y="178.95" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    get_character();</text><text x="240" y="196.77" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  }</text><text x="240" y="214.6" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  store_character(identifier, i, 0); // null-terminated</text><text x="240" y="232.42" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  symbol = identifier_or_keyword();</text><text x="240" y="250.25" font-size="11.5" fill="var(--ink-2)" text-anchor="start