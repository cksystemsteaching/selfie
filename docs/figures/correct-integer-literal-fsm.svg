<text x="40" y="350" font-size="13.2" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">integer        = "0" | non_zero_digit { digit } .</text>
<text x="40" y="368" font-size="13.2" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">non_zero_digit = "1" | … | "9" .</text>
<text x="40" y="386" font-size="13.2" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">digit          = "0" | non_zero_digit .</text>
