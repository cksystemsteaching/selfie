bad)" text-anchor="middle" dominant-baseline="central">l</text><rect x="847.5" y="243.33" width="17.5" height="26.19" fill="none" stroke="var(--line)" stroke-width="0.8"/><text x="856.25" y="256.43" font-size="10" fill="var(--bad)" text-anchor="middle" dominant-baseline="central">l</text><rect x="865" y="243.33" width="17.5" height="26.19" fill="none" stroke="var(--line)" stroke-width="0.8"/><text x="873.75" y="256.43" font-size="10" fill="var(--bad)" text-anchor="middle" dominant-baseline="central">e</text><rect x="882.5" y="243.33" width="17.5" height="26.19" fill="none" stroke="var(--line)" stroke-width="0.8"/><text x="891.25" y="256.43" font-size="10" fill="var(--bad)" text-anchor="middle" dominant-baseline="central">H</text><line x1="760" y1="196.19" x2="900" y2="196.19" stroke="var(--line)" stroke-width="1"/><text x="894" y="206.67" font-size="10" fill="var(--muted)" text-anchor="end" dominant-baseline="central" class="serif">(unused)</text><line x1="760" y1="133.33" x2="900" y2="133.33" stroke="var(--line)" stroke-width="1"/><text x="830" y="177.33" font-size="13" fill="var(--syn)" text-anchor="middle" dominant-baseline="central" class="serif">heap</text><line x1="830" y1="167.9" x2="830" y2="149.05" stroke="var(--syn)" stroke-width="1"/><path d="M830 149.05 L831.95 153.65 L828.05 153.65 Z" fill="var(--syn)"/><line x1="760" y1="60" x2="900" y2="60" stroke="var(--line)" stroke-width="1"/><text x="830" y="82" font-size="13" fill="var(--syn)" text-anchor="middle" dominant-baseline="central" class="serif">stack</text><line x1="830" y1="93" x2="830" y2="115" stroke="var(--syn)" stroke-width="1"/><path d="M830 115 L828.05 110.39 L831.95 110.39 Z" fill="var(--syn)"/>
