<rect x="180" y="60" width="400" height="343.5" fill="var(--panel)" stroke="var(--line)" stroke-width="1" rx="3"/><text x="380" y="48" font-size="12" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">starc</text><text x="190" y="72" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">void load_integer(uint64_t value) {</text><text x="190" y="88.28" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  if (is_signed_integer(value, 32)) {</text><text x="190" y="104.55" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    talloc();</text><text x="190" y="120.83" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    load_small_and_medium_integer(current_temporary(), value);</text><text x="190" y="137.1" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  } else load_big_integer(value);</text><text x="190" y="153.38" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">}</text><text x="190" y="169.65" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">void load_small_and_medium_integer(uint64_t reg, uint64_t value) {</text><text x="190" y="185.93" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  if (is_signed_integer(value, 12))</text><text x="190" y="202.2" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    emit_addi(reg, REG_ZR, value);   // one instruction</text><text x="190" y="218.48" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  else ...</text><text x="190" y="234.75" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">}</text><text x="190" y="251.03" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">void load_string() {</text><text x="190" y="267.3" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  entry = search_global_symbol_table(string, STRING);</text><text x="190" y="283.58" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  if (entry == 0) {</text><text x="190" y="299.85" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    data_size = data_size + round_up(string_length(string) + 1, WORDSIZE);</text><text x="190" y="316.12" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    entry = create_symbol_table_entry(GLOBAL_TABLE, string, ...);</text><text x="190" y="332.4" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    emit_string_data(entry);</text><text x="190" y="348.68" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  }</text><text x="190" y="364.95" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  load_address(entry);              // addi t0,zero,-ds ; add t0,gp,t0</text><text x="190" y="381.23" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">}</text>
