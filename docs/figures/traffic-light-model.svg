<svg xmlns="http://www.w3.org/2000/svg" viewBox="41.6 36.0 525.4 548.0" width="525" height="548" role="img" aria-label="The process states blocked, ready and running, and the transitions between them">
<title>The process states blocked, ready and running, and the transitions between them</title>
<style>svg{--ink:#131C2A;--ink-2:#39485C;--muted:#5D6E85;--line:rgba(19,28,42,.18);--syn:#A2661A;--sem:#1F6C86;--bad:#A63E5A;--panel:#FFFFFF;--ground:#EFF1F3}@media (prefers-color-scheme: dark){svg{--ink:#E7EDF6;--ink-2:#B6C4D8;--muted:#8093AF;--line:rgba(122,162,204,.16);--syn:#E0A550;--sem:#5BB0C7;--bad:#C8607A;--panel:#111C2E;--ground:#080E18}}text{font-family:"JetBrains Mono","SFMono-Regular","SF Mono","Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif}</style>
<circle cx="300" cy="120" r="70" fill="none" stroke="var(--bad)" stroke-width="2"/>
<text x="300" y="120" font-size="18" fill="var(--bad)" text-anchor="middle" dominant-baseline="central" class="serif">blocked</text>
<circle cx="300" cy="310" r="70" fill="none" stroke="var(--syn)" stroke-width="2"/>
<text x="300" y="310" font-size="18" fill="var(--syn)" text-anchor="middle" dominant-baseline="central" class="serif">ready</text>
<circle cx="300" cy="500" r="70" fill="none" stroke="var(--sem)" stroke-width="2"/>
<text x="300" y="500" font-size="18" fill="var(--sem)" text-anchor="middle" dominant-baseline="central" class="serif">running</text>
<path d="M340 180 Q370 215 340 250" fill="none" stroke="var(--ink-2)" stroke-width="1.2"/><line x1="341.8" y1="247.9" x2="340" y2="250" stroke="var(--ink-2)" stroke-width="1.2"/><path d="M340 250 L341.82 244.28 L345.37 247.32 Z" fill="var(--ink-2)"/><text x="395" y="215" font-size="12" fill="var(--ink-2)" text-anchor="middle" dominant-baseline="central" class="serif">unblock</text>
<path d="M260 250 Q230 215 260 180" fill="none" stroke="var(--ink-2)" stroke-width="1.2"/><line x1="258.2" y1="182.1" x2="260" y2="180" stroke="var(--ink-2)" stroke-width="1.2"/><path d="M260 180 L258.18 185.72 L254.63 182.68 Z" fill="var(--ink-2)"/><text x="225" y="215" font-size="12" fill="var(--ink-2)" text-anchor="middle" dominant-baseline="central" class="serif">kill</text>
<path d="M340 370 Q370 405 340 440" fill="none" stroke="var(--ink-2)" stroke-width="1.2"/><line x1="341.8" y1="437.9" x2="340" y2="440" stroke="var(--ink-2)" stroke-width="1.2"/><path d="M340 440 L341.82 434.28 L345.37 437.32 Z" fill="var(--ink-2)"/><text x="395" y="405" font-size="12" fill="var(--ink-2)" text-anchor="middle" dominant-baseline="central" class="serif">run</text>
<path d="M260 440 Q230 405 260 370" fill="none" stroke="var(--ink-2)" stroke-width="1.2"/><line x1="258.2" y1="372.1" x2="260" y2="370" stroke="var(--ink-2)" stroke-width="1.2"/><path d="M260 370 L258.18 375.72 L254.63 372.68 Z" fill="var(--ink-2)"/><text x="225" y="405" font-size="12" fill="var(--ink-2)" text-anchor="middle" dominant-baseline="central" class="serif">yield</text>
<path d="M240 540 Q60 310 240 80" fill="none" stroke="var(--ink-2)" stroke-width="1.2"/><line x1="229.2" y1="93.8" x2="240" y2="80" stroke="var(--ink-2)" stroke-width="1.2"/><path d="M240 80 L238.43 85.79 L234.75 82.91 Z" fill="var(--ink-2)"/><text x="70" y="310" font-size="12" fill="var(--ink-2)" text-anchor="middle" dominant-baseline="central" class="serif">block</text>
<path d="M360 80 Q540 310 360 540" fill="none" stroke="var(--ink-2)" stroke-width="1.2"/><line x1="370.8" y1="526.2" x2="360" y2="540" stroke="var(--ink-2)" stroke-width="1.2"/><path d="M360 540 L361.57 534.21 L365.25 537.09 Z" fill="var(--ink-2)"/><text x="535" y="310" font-size="12" fill="var(--ink-2)" text-anchor="middle" dominant-baseline="central" class="serif">handle</text>
</svg>
