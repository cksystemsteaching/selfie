<title>Elementary expressions: a context-free grammar, one finite state machine per non-terminal, and a stack</title>
<style>svg{--ink:#131C2A;--ink-2:#39485C;--muted:#5D6E85;--line:rgba(19,28,42,.18);--syn:#A2661A;--sem:#1F6C86;--bad:#A63E5A;--panel:#FFFFFF;--ground:#EFF1F3}@media (prefers-color-scheme: dark){svg{--ink:#E7EDF6;--ink-2:#B6C4D8;--muted:#8093AF;--line:rgba(122,162,204,.16);--syn:#E0A550;--sem:#5BB0C7;--bad:#C8607A;--panel:#111C2E;--ground:#080E18}}text{font-family:"JetBrains Mono","SFMono-Regular","SF Mono","Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif}</style>
<text x="40" y="40" font-size="12" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">expression = term { ( "+" | "-" ) term } .</text>
<text x="40" y="60" font-size="12" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">term       = factor { ( "*" | "/" ) factor } .</text>
<text x="40" y="80" font-size="12" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">factor     = literal | identifier | "(" expression ")" .</text>
<text x="720" y="60" font-size="13" fill="var(--syn)" text-anchor="end" dominant-baseline="central" class="serif">context-free grammar</text>
