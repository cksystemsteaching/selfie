<rect x="230" y="60" width="440" height="285.38" fill="var(--panel)" stroke="var(--line)" stroke-width="1" rx="3"/><text x="450" y="48" font-size="12" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">starc</text><text x="240" y="72" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">} else if (character == CHAR_DOUBLEQUOTE) {</text><text x="240" y="89.83" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  get_character();</text><text x="240" y="107.65" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  string = string_alloc(MAX_STRING_LENGTH);</text><text x="240" y="125.47" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  i = 0;</text><text x="240" y="143.3" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  while (is_character_not_double_quote_or_new_line_or_eof()) {</text><text x="240" y="161.12" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    if (character == CHAR_BACKSLASH)</text><text x="240" y="178.95" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      handle_escape_sequence();</text><text x="240" y="196.77" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    store_character(string, i, character);</text><text x="240" y="214.6" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    i = i + 1;</text><text x="240" y="232.42" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    get_character();</text><text x="240" y="250.25" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  }</text><text x="240" y="268.07" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  if (character == CHAR_DOUBLEQUOTE) get_character();</text><text x="240" y="285.9" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  else syntax_error_expected_character(CHAR_DOUBLEQUOTE);</text><text x="240" y="303.73" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  store_character(string, i, 0); // null-terminated</text><text x="240" y="321.55" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  symbol = SYM_STRING;</text>
