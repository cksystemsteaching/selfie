<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.3 31.0 995.5 576.0" width="996" height="576" role="img" aria-label="Paging: a page table maps virtual pages to physical page frames, and a virtual address is a page number and a byte in the page">
