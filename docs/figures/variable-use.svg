<rect x="190" y="60" width="430" height="376.05" fill="var(--panel)" stroke="var(--line)" stroke-width="1" rx="3"/><text x="405" y="48" font-size="12" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">starc</text><text x="200" y="72" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">uint64_t compile_factor() {</text><text x="200" y="88.28" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  ...</text><text x="200" y="104.55" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  else if (symbol == SYM_IDENTIFIER) {</text><text x="200" y="120.83" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    variable_or_procedure = identifier; get_symbol();</text><text x="200" y="137.1" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    if (symbol != SYM_LPARENTHESIS)</text><text x="200" y="153.38" font-size="10.5" fill="var(--muted)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      // variable access</text><text x="200" y="169.65" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      type = load_variable(variable_or_procedure);</text><text x="200" y="185.93" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    else ... // procedure call</text><text x="200" y="202.2" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  }</text><text x="200" y="218.48" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  ...</text><text x="200" y="234.75" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">}</text><text x="200" y="251.03" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">uint64_t load_variable(char* variable) {</text><text x="200" y="267.3" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  return load_value(get_variable_entry(variable));</text><text x="200" y="283.58" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">}</text><text x="200" y="299.85" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">uint64_t load_value(uint64_t* entry) {</text><text x="200" y="316.12" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  offset = load_upper_address(entry);</text><text x="200" y="332.4" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  if (offset == get_address(entry)) {</text><text x="200" y="348.68" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    talloc();</text><text x="200" y="364.95" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    emit_load(current_temporary(), get_scope(entry), offset);</text><text x="200" y="381.23" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  } else ...</text><text x="200" y="397.5" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  return get_type(entry);</text><text x="200" y="413.78" font-size="10.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">}</text>
