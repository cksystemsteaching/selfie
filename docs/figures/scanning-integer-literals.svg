<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="scanning integer literals">
<title>scanning integer literals</title>
<style>svg{--ink:#131C2A;--ink-2:#39485C;--muted:#5D6E85;--line:rgba(19,28,42,.18);--syn:#A2661A;--sem:#1F6C86;--bad:#A63E5A;--panel:#FFFFFF;--ground:#EFF1F3}@media (prefers-color-scheme: dark){svg{--ink:#E7EDF6;--ink-2:#B6C4D8;--muted:#8093AF;--line:rgba(122,162,204,.16);--syn:#E0A550;--sem:#5BB0C7;--bad:#C8607A;--panel:#111C2E;--ground:#080E18}}text{font-family:"JetBrains Mono","SFMono-Regular","SF Mono","Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif}</style>
<text x="110" y="50" font-size="16" fill="var(--ink)" text-anchor="middle" dominant-baseline="central" class="serif">scanning integer literals</text>
<rect x="30" y="30" width="160" height="40" fill="none" stroke="var(--ink-2)" stroke-width="1"/>
<text x="110" y="110" font-size="13" fill="var(--muted)" text-anchor="middle" dominant-baseline="central" class="serif">example:</text>
<text x="110" y="140" font-size="20" fill="var(--sem)" text-anchor="middle" dominant-baseline="central">85</text>
<text x="110" y="165" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="central" class="serif">two digits, then a NULL</text>
<rect x="230" y="60" width="440" height="303.2" fill="var(--panel)" stroke="var(--line)" stroke-width="1" rx="3"/><text x="450" y="48" font-size="12" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">starc</text><text x="240" y="72" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">} else if (is_digit(character)) {</text><text x="240" y="89.83" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  if (character == '0') {</text><text x="240" y="107.65" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    get_character();</text><text x="240" y="125.47" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    literal = 0;</text><text x="240" y="143.3" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  } else {</text><text x="240" y="161.12" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    integer = string_alloc(MAX_INTEGER_LENGTH);</text><text x="240" y="178.95" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    i = 0;</text><text x="240" y="196.77" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    while (is_digit(character)) {</text><text x="240" y="214.6" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      store_character(integer, i, character);</text><text x="240" y="232.42" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      i = i + 1;</text><text x="240" y="250.25" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      get_character();</text><text x="240" y="268.07" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    }</text><text x="240" y="285.9" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    store_character(integer, i, 0); // null-terminated</text><text x="240" y="303.73" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    literal = atoi(integer);</text><text x="240" y="321.55" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  }</text><text x="240" y="339.38" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  symbol = SYM_INTEGER;</text>
