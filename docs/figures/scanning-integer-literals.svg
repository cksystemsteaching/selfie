<text x="30" y="530" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">integer        = "0" | non_zero_digit { digit } .</text>
<text x="30" y="548" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">non_zero_digit = "1" | … | "9" .</text>
<text x="30" y="566" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">digit          = "0" | non_zero_digit .</text>
