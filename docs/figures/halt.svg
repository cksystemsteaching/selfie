<svg xmlns="http://www.w3.org/2000/svg" viewBox="50.0 44.5 606.6 366.5" width="607" height="366" role="img" aria-label="The halting construction: D asks H about itself and does the opposite">
<title>The halting construction: D asks H about itself and does the opposite</title>
<style>svg{--ink:#131C2A;--ink-2:#39485C;--muted:#5D6E85;--line:rgba(19,28,42,.18);--syn:#A2661A;--sem:#1F6C86;--bad:#A63E5A;--panel:#FFFFFF;--ground:#EFF1F3}@media (prefers-color-scheme: dark){svg{--ink:#E7EDF6;--ink-2:#B6C4D8;--muted:#8093AF;--line:rgba(122,162,204,.16);--syn:#E0A550;--sem:#5BB0C7;--bad:#C8607A;--panel:#111C2E;--ground:#080E18}}text{font-family:"JetBrains Mono","SFMono-Regular","SF Mono","Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif}</style>
<rect x="240" y="58.5" width="224" height="69.75" fill="var(--ground)" stroke="var(--line)" stroke-width="1.2" rx="4"/>
<text x="352" y="85" font-size="36" fill="var(--sem)" text-anchor="middle" dominant-baseline="central">H</text>
<text x="352" y="111.51" font-size="13.77" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">decides halting</text>
<line x1="64" y1="93.38" x2="232" y2="93.38" stroke="var(--line)" stroke-width="1.4"/><path d="M232 93.38 L227.39 95.32 L227.39 91.43 Z" fill="var(--line)"/>
<text x="72" y="75.38" font-size="16.2" fill="var(--syn)" text-anchor="start" dominant-baseline="central">P, x</text>
<line x1="472" y1="79.42" x2="568" y2="79.42" stroke="var(--line)" stroke-width="1.4"/><path d="M568 79.42 L563.39 81.37 L563.39 77.48 Z" fill="var(--line)"/>
<line x1="472" y1="110.81" x2="568" y2="110.81" stroke="var(--line)" stroke-width="1.4"/><path d="M568 110.81 L563.39 112.76 L563.39 108.87 Z" fill="var(--line)"/>
<text x="580" y="79.42" font-size="16.2" fill="var(--muted)" text-anchor="start" dominant-baseline="central">halts</text>
<text x="580" y="110.81" font-size="16.2" fill="var(--muted)" text-anchor="start" dominant-baseline="central">loops</text>
<g class="f" data-step="1"><rect x="144.8" y="216" width="414.4" height="83.7" fill="none" stroke="var(--syn)" stroke-width="1" rx="4" stroke-dasharray="4 3"/><text x="352" y="244.46" font-size="27.9" fill="var(--syn)" text-anchor="middle" dominant-baseline="central">D(P)</text><text x="352" y="277.94" font-size="11.66" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">ask H about P on P — then do the opposite</text><line x1="352" y1="132.75" x2="352" y2="211.5" stroke="var(--line)" stroke-width="1.4"/><path d="M352 211.5 L350.05 206.89 L353.95 206.89 Z" fill="var(--line)"/></g>
<g class="f" data-step="2"><path d="M616.75 271.82 A24.75 24.75 0 1 1 615.52 242.23" fill="none" stroke="var(--bad)" stroke-width="1.5"/><line x1="616.28" y1="243.21" x2="617.64" y2="245.27" stroke="var(--bad)" stroke-width="1.4"/><path d="M617.64 245.27 L613.48 242.5 L616.73 240.35 Z" fill="var(--bad)"/><text x="596.33" y="307.35" font-size="18.63" fill="var(--bad)" text-anchor="middle" dominant-baseline="central">D(D)</text><text x="464" y="387" font-size="17.01" fill="var(--bad)" text-anchor="middle" dominant-baseline="central">halts ⟺ ¬halts   —   so H cannot exist</text></g>
</svg>
