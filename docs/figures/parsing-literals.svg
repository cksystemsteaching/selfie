<text x="30" y="470" font-size="11" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">factor  = [ cast ] [ "-" ] [ "*" ] ( "sizeof" "(" type ")" | literal | identifier | call | "(" expression ")" ) .</text>
<text x="30" y="488" font-size="11" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">literal = value | string .</text>
<text x="30" y="506" font-size="11" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">value   = integer | character .</text>
