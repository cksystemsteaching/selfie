)" text-anchor="middle" dominant-baseline="central">85</text><text x="936" y="152.77" font-size="10.5" fill="var(--syn)" text-anchor="start" dominant-baseline="central">n</text><line x1="932" y1="152.77" x2="913" y2="152.77" stroke="var(--line)" stroke-width="1"/><path d="M913 152.77 L916.68 151.21 L916.68 154.33 Z" fill="var(--line)"/><line x1="760" y1="160.72" x2="910" y2="160.72" stroke="var(--line)" stroke-width="0.8"/><text x="835" y="168.67" font-size="10.5" fill="var(--bad)" text-anchor="middle" dominant-baseline="central">0</text><text x="936" y="168.67" font-size="10.5" fill="var(--syn)" text-anchor="start" dominant-baseline="central">c</text><line x1="932" y1="168.67" x2="913" y2="168.67" stroke="var(--line)" stroke-width="1"/><path d="M913 168.67 L916.68 167.12 L916.68 170.23 Z" fill="var(--line)"/><line x1="760" y1="60" x2="910" y2="60" stroke="var(--line)" stroke-width="1"/><text x="835" y="75.9" font-size="13" fill="var(--syn)" text-anchor="middle" dominant-baseline="central" class="serif">stack</text><line x1="835" y1="83.86" x2="835" y2="99.76" stroke="var(--syn)" stroke-width="1"/><path d="M835 99.76 L833.05 95.15 L836.95 95.15 Z" fill="var(--syn)"/>
