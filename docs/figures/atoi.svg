<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-label="Computing the numerical value of an integer literal, digit by digit">
<title>Computing the numerical value of an integer literal, digit by digit</title>
<style>svg{--ink:#131C2A;--ink-2:#39485C;--muted:#5D6E85;--line:rgba(19,28,42,.18);--syn:#A2661A;--sem:#1F6C86;--bad:#A63E5A;--panel:#FFFFFF;--ground:#EFF1F3}@media (prefers-color-scheme: dark){svg{--ink:#E7EDF6;--ink-2:#B6C4D8;--muted:#8093AF;--line:rgba(122,162,204,.16);--syn:#E0A550;--sem:#5BB0C7;--bad:#C8607A;--panel:#111C2E;--ground:#080E18}}text{font-family:"JetBrains Mono","SFMono-Regular","SF Mono","Cascadia Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace}.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","URW Palladio L",Georgia,serif}</style>
<text x="110" y="50" font-size="15" fill="var(--ink)" text-anchor="middle" dominant-baseline="central" class="serif">computing numerical values</text>
<rect x="30" y="30" width="160" height="40" fill="none" stroke="var(--ink-2)" stroke-width="1"/>
<text x="110" y="110" font-size="13" fill="var(--muted)" text-anchor="middle" dominant-baseline="central" class="serif">example:</text>
<text x="110" y="140" font-size="18" fill="var(--sem)" text-anchor="middle" dominant-baseline="central">"85"</text>
<text x="110" y="165" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="central" class="serif">ASCII 53, 56</text>
<line x1="110" y1="180" x2="110" y2="210" stroke="var(--line)" stroke-width="1"/><path d="M110 210 L108.05 205.39 L111.95 205.39 Z" fill="var(--line)"/>
<text x="110" y="230" font-size="16" fill="var(--sem)" text-anchor="middle" dominant-baseline="central">1010101</text>
<text x="110" y="252" font-size="11" fill="var(--muted)" text-anchor="middle" dominant-baseline="central" class="serif">binary 85</text>
<rect x="230" y="60" width="440" height="249.72" fill="var(--panel)" stroke="var(--line)" stroke-width="1" rx="3"/><text x="450" y="48" font-size="12" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">starc</text><text x="240" y="72" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">uint64_t atoi(char* s) {</text><text x="240" y="89.83" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  uint64_t i; uint64_t n; uint64_t c;</text><text x="240" y="107.65" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  i = 0;   // leftmost digit first</text><text x="240" y="125.47" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  n = 0;   // numerical value so far</text><text x="240" y="143.3" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  c = load_character(s, i);</text><text x="240" y="161.12" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  while (c != 0) {</text><text x="240" y="178.95" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    c = c - '0';       // '5' is 53, so 53 - 48 = 5</text><text x="240" y="196.77" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    n = n * 10 + c;    // base 10, with overflow check</text><text x="240" y="214.6" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    i = i + 1;</text><text x="240" y="232.42" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    c = load_character(s, i);</text><text x="240" y="250.25" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  }</text><text x="240" y="268.07" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  return n;</text><text x="240" y="285.9" font-size="11.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">}</text>
