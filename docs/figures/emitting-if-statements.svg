<text x="90" y="90" font-size="18" fill="var(--sem)" text-anchor="middle" dominant-baseline="central">if (x &lt; 7)</text>
<text x="90" y="120" font-size="18" fill="var(--sem)" text-anchor="middle" dominant-baseline="central">  x = x + 7;</text>
<text x="90" y="150" font-size="18" fill="var(--sem)" text-anchor="middle" dominant-baseline="central">else</text>
<text x="90" y="180" font-size="18" fill="var(--sem)" text-anchor="middle" dominant-baseline="central">  x = x - 7;</text>
<rect x="190" y="60" width="430" height="415.57" fill="var(--panel)" stroke="var(--line)" stroke-width="1" rx="3"/><text x="405" y="48" font-size="12" fill="var(--muted)" text-anchor="middle" dominant-baseline="central">starc</text><text x="200" y="72" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">void compile_if() {</text><text x="200" y="86.72" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  if (symbol == SYM_IF) {</text><text x="200" y="101.45" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    get_symbol();</text><text x="200" y="116.17" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    if (symbol == SYM_LPARENTHESIS) {</text><text x="200" y="130.9" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      get_symbol();</text><text x="200" y="145.62" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      compile_expression();</text><text x="200" y="160.35" font-size="9.5" fill="var(--muted)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      // if false, skip the true case</text><text x="200" y="175.07" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      branch_forward_to_else_or_end = code_size;</text><text x="200" y="189.8" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      emit_beq(current_temporary(), REG_ZR, 0);</text><text x="200" y="204.53" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      tfree(1);</text><text x="200" y="219.25" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      if (symbol == SYM_RPARENTHESIS) {</text><text x="200" y="233.97" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">        get_symbol();</text><text x="200" y="248.7" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">        compile_statement();   // or a block</text><text x="200" y="263.42" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">        if (symbol == SYM_ELSE) {</text><text x="200" y="278.15" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">          get_symbol();</text><text x="200" y="292.88" font-size="9.5" fill="var(--muted)" text-anchor="start" dominant-baseline="central" xml:space="preserve">          // if true, jump over else</text><text x="200" y="307.6" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">          jump_forward_to_end = code_size;</text><text x="200" y="322.32" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">          emit_jal(REG_ZR, 0);</text><text x="200" y="337.05" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">          fixup_relative_BFormat(branch_forward_to_else_or_end);</text><text x="200" y="351.77" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">          compile_statement(); // or a block</text><text x="200" y="366.5" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">          fixup_relative_JFormat(jump_forward_to_end, code_size);</text><text x="200" y="381.22" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">        } else</text><text x="200" y="395.95" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">          fixup_relative_BFormat(branch_forward_to_else_or_end);</text><text x="200" y="410.68" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">      } else ...</text><text x="200" y="425.4" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">    } else ...</text><text x="200" y="440.12" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">  } else ...</text><text x="200" y="454.85" font-size="9.5" fill="var(--ink-2)" text-anchor="start" dominant-baseline="central" xml:space="preserve">}</text>
